# Render blueprint. `render blueprint launch` or connect the repo in the UI.
#
# One web service and one PostgreSQL instance. The web service serves both the
# API and the built frontend, so there is a single origin and no CORS surface.
services:
  - type: web
    name: prahari
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      # Only needed while STORAGE_PROVIDER=local. Move to S3/R2 for anything
      # beyond a pilot — a container disk is not a backup.
      name: prahari-uploads
      mountPath: /app/var/uploads
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: AUTO_SEED_DEMO
        value: "false"
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: prahari-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # Same-origin deployment: the API serves the frontend. Set this to your
        # Vercel domain instead if you split them.
        value: https://prahari-7m0e.onrender.com
      - key: TRUSTED_HOSTS
        # The live service's real hostname. Render appends a suffix when the
        # plain name is taken, so check the service page before relaunching.
        value: prahari-7m0e.onrender.com
      - key: WEATHER_PROVIDER
        # WeatherAPI.com first when a key is present, Open-Meteo behind it,
        # then the cache. With no key this is exactly Open-Meteo.
        value: auto
      - key: WEATHER_API_KEY
        # sync: false means Render prompts for this in the dashboard and it is
        # never stored in this file. Backend only — no weather key of any kind
        # reaches the browser.
        sync: false
      # The FREE WeatherAPI plan. Raise these to match a paid plan; leaving
      # them too high makes a provider claim a window it cannot fill.
      - key: WEATHERAPI_HISTORY_DAYS
        value: "1"
      - key: WEATHERAPI_FORECAST_DAYS
        value: "3"
      - key: VISION_PROVIDER
        value: none
      - key: ALLOW_FEATURE_ENGINE
        value: "true"
      # AgriDoc's language model. The assistant works without it — answers are
      # assembled from retrieved rows — and a key only changes their wording;
      # every number in a reworded answer is checked against those rows first.
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        # sync: false means Render prompts for this in the dashboard and it is
        # never stored in this file. A key committed here would be public the
        # moment the repository is, and would be readable by anyone who can see
        # the blueprint. It is read server-side only and never sent to the
        # browser. A farmer's own key is separate and encrypted at rest.
        sync: false
      - key: GEMINI_API_KEY
        # Accepted as an alias of LLM_API_KEY (the live service uses this
        # name). Set one of the two, in the dashboard only.
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: SMS_PROVIDER
        value: none
      # Never set on production: generated weather would reach real farmers'
      # risk decisions. The code ignores it in production anyway.
      - key: WEATHER_DEMO_FALLBACK
        value: "false"

  # Judge / staging service. Synthetic data only, generated and labelled
  # weather, its own throwaway SQLite database re-seeded on every restart.
  # DEMO_MODE is refused when APP_ENV=production, which is why this is a
  # separate service and never a flag on the one above. Live as
  # https://prahari-staging.onrender.com (created 17 Nov 2026).
  - type: web
    name: prahari-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: DEMO_CONSOLE_ACCESS
        value: "true"
      - key: WEATHER_PROVIDER
        value: demo
      - key: DATABASE_URL
        value: sqlite:////app/var/prahari-staging.db
      - key: VISION_PROVIDER
        value: none
      - key: ALLOW_FEATURE_ENGINE
        value: "true"
      - key: STORAGE_PROVIDER
        value: local
      - key: SMS_PROVIDER
        value: none

# Why the database is NOT on the free plan: a free Render PostgreSQL instance
# expires 30 days after creation and is then deleted. That is what took the
# live site down in October 2026 — DATABASE_URL kept pointing at a host that no
# longer existed. The app now stays up and answers 503 database_unavailable in
# that state (see main.py), but the data is still gone. Use a paid plan, or an
# external PostgreSQL with backups, for anything that must persist.
databases:
  - name: prahari-db
    plan: basic-256mb
    postgresMajorVersion: "16"
