line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # long lines are usually a long, deliberate sentence in a docstring
  "B008",   # FastAPI's Depends() in a default is the framework's own idiom
  "SIM108", # a ternary is not always clearer than an if
]

[lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
